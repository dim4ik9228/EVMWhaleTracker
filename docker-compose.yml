services:
  postgres:
    image: postgres:16-alpine
    container_name: evmwhaletracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: EvmWhaleTracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Export existing database credentials first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./.docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EvmWhaleTracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: evmwhaletracker-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: true
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
    volumes:
      - type: bind
        source: ./src/Presentation.Telegram/appsettings.Local.json
        target: /app/appsettings.Local.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
