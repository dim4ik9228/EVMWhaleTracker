services:
  postgres:
    image: postgres:16-alpine
    container_name: evmwhaletracker-postgres
    environment:
      POSTGRES_DB: EvmWhaleTracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./.docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EvmWhaleTracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evmwhaletracker-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=EvmWhaleTracker;Username=postgres;Password=postgres
      TelegramBot__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      BlockchainNetworks__RpcApiKey: ${BLOCKCHAIN_RPC_API_KEY:-}
      BlockchainNetworks__EnableRpcDiagnostics: ${BLOCKCHAIN_ENABLE_RPC_DIAGNOSTICS:-false}
      BlockchainNetworks__PreferWebSocket: "true"
      BlockchainNetworks__PollInterval: ${BLOCKCHAIN_POLL_INTERVAL:-00:00:02}
      BlockchainNetworks__WebSocketReconnectDelay: ${BLOCKCHAIN_WEB_SOCKET_RECONNECT_DELAY:-00:00:05}
      BlockchainNetworks__Networks__0__Chain: ${BLOCKCHAIN_0_CHAIN:-Bsc}
      BlockchainNetworks__Networks__0__Enabled: ${BLOCKCHAIN_0_ENABLED:-false}
      BlockchainNetworks__Networks__0__HttpRpcUrl: ${BLOCKCHAIN_0_HTTP_RPC_URL:-}
      BlockchainNetworks__Networks__0__WebSocketRpcUrl: ${BLOCKCHAIN_0_WEB_SOCKET_RPC_URL:-}
      BlockchainNetworks__Networks__1__Chain: ${BLOCKCHAIN_1_CHAIN:-Base}
      BlockchainNetworks__Networks__1__Enabled: ${BLOCKCHAIN_1_ENABLED:-false}
      BlockchainNetworks__Networks__1__HttpRpcUrl: ${BLOCKCHAIN_1_HTTP_RPC_URL:-}
      BlockchainNetworks__Networks__1__WebSocketRpcUrl: ${BLOCKCHAIN_1_WEB_SOCKET_RPC_URL:-}
      BlockchainNetworks__Networks__2__Chain: ${BLOCKCHAIN_2_CHAIN:-Arbitrum}
      BlockchainNetworks__Networks__2__Enabled: ${BLOCKCHAIN_2_ENABLED:-false}
      BlockchainNetworks__Networks__2__HttpRpcUrl: ${BLOCKCHAIN_2_HTTP_RPC_URL:-}
      BlockchainNetworks__Networks__2__WebSocketRpcUrl: ${BLOCKCHAIN_2_WEB_SOCKET_RPC_URL:-}
      BlockchainNetworks__Networks__3__Chain: ${BLOCKCHAIN_3_CHAIN:-Ethereum}
      BlockchainNetworks__Networks__3__Enabled: ${BLOCKCHAIN_3_ENABLED:-false}
      BlockchainNetworks__Networks__3__HttpRpcUrl: ${BLOCKCHAIN_3_HTTP_RPC_URL:-}
      BlockchainNetworks__Networks__3__WebSocketRpcUrl: ${BLOCKCHAIN_3_WEB_SOCKET_RPC_URL:-}
      EnsReverseLookup__Enabled: ${ENS_REVERSE_LOOKUP_ENABLED:-true}
      EnsReverseLookup__Timeout: ${ENS_REVERSE_LOOKUP_TIMEOUT:-00:00:02}
    restart: unless-stopped
